<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | SVA Locksmith</title>
    <!-- We still try to load your main stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css?v=1.2">
    
    <!-- Emergency Inline Styles (Failsafe) -->
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .offline-title {
            color: #2ecc71;
            margin-bottom: 10px;
        }
        .offline-text {
            color: #cccccc;
            margin-bottom: 30px;
            max-width: 400px;
            line-height: 1.5;
        }
        .emergency-btn {
            background-color: #e67e22;
            color: #ffffff;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="offline-icon">📡</div>
    <h1 class="offline-title">No Data Connection</h1>
    
    <p class="offline-text">
        It looks like you have lost internet access or have a weak signal.<br><br>
        Don't worry—if you are locked out or need emergency assistance, regular phone calls still work on the cellular network.
    </p>

    <!-- Swap this placeholder number with your actual dispatch number -->
    <a href="tel:07123123456" class="emergency-btn">📞 Call Dispatch Now</a>

</body>
</html>
