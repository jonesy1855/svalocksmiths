<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Trade Login | Shropshire Vehicle Access</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=1.1">
    
    <!-- Firebase App & Auth Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body {
            background-color: #0d0d0d;
            color: #d1d5db;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #111;
            border-bottom: 1px solid #222;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: #14171f;
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .login-card h2 {
            color: #fff;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 6px;
            text-align: center;
        }

        .login-card p {
            color: #9ca3af;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #0a0a0a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2ecc71;
        }

        .login-btn {
            width: 100%;
            background-color: #2ecc71;
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #27ae60;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2ecc71;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        #loginError {
            color: #e74c3c;
            font-size: 0.82rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div style="color: #2ecc71; font-weight: 800; font-size: 1.1rem;">SVA FieldMate Pro</div>
        <a href="../preview.html" style="color: #d1d5db; text-decoration: none; font-size: 0.85rem;">← Exit to Home</a>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <h2>Pro Trade Sign In</h2>
            <p>Access locked vehicle data, security warnings, and advanced bypass notes.</p>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Trade Email</label>
                    <input type="email" id="email" required placeholder="name@yourlocksmithbusiness.co.uk">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••••••">
                </div>

                <div id="loginError">Invalid email or password.</div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <a href="../preview.html" class="back-home">Return to Field Workspace</a>
        </div>
    </div>

<script>
    // 1. Your Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyD6xQcZ3458Jn75Q1sFNyS7lxZuT9JOPTg",
        authDomain: "sva-auth.firebaseapp.com",
        projectId: "sva-auth",
        storageBucket: "sva-auth.firebasestorage.app",
        messagingSenderId: "778693286501",
        appId: "1:778693286501:web:594b3f4618c542ee0b848c",
        measurementId: "G-5GWZJKDN36"
    };

    // Initialize Firebase (Compat SDK style)
    firebase.initializeApp(firebaseConfig);

    // 2. Handle Login Submission
    function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');
        const submitBtn = document.querySelector('.login-btn');

        // Give visual feedback that it's working
        submitBtn.textContent = "Authenticating...";
        submitBtn.disabled = true;
        errorDiv.style.display = 'none';

        firebase.auth().signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                // Success! Redirect back to your app workspace
                window.location.href = "../preview.html"; 
            })
            .catch((error) => {
                // Handle errors cleanly 
                submitBtn.textContent = "Sign In";
                submitBtn.disabled = false;
                errorDiv.textContent = "Access Denied: Check your email or password.";
                errorDiv.style.display = 'block';
            });
    }
</script>

</body>
</html>
