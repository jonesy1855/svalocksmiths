<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activating Pro Access - SVA FieldMate Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="background: #0b0e14; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>⚡ Activating Your Pro License...</h2>
    <p>Verifying trade credentials and syncing payment...</p>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6xQcZ3458Jn75Q1sFNyS7lxZuT9JOPTg",
            authDomain: "sva-auth.firebaseapp.com",
            projectId: "sva-auth",
            storageBucket: "sva-auth.firebasestorage.app",
            messagingSenderId: "778693286501",
            appId: "1:778693286501:web:594b3f4618c542ee0b848c"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Use Firebase Auth observer with a built-in safety check
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    // Explicitly write pro_unlimited tier to their UID document
                    await firebase.firestore().collection('users').doc(user.uid).set({
                        tier: 'pro_unlimited',
                        email: user.email,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    document.querySelector('h2').textContent = "✅ Pro Access Activated!";
                    document.querySelector('p').textContent = "Database synced successfully. Redirecting to workspace...";
                    
                    setTimeout(() => {
                        window.location.href = "preview.html";
                    }, 1800);
                } catch (err) {
                    console.error("Firestore error:", err);
                    document.querySelector('h2').textContent = "⚠️ Sync Error";
                    document.querySelector('p').textContent = "Payment successful, but database update failed. Please refresh.";
                }
            } else {
                // Fallback if auth state is still initializing
                setTimeout(() => {
                    const currentUser = firebase.auth().currentUser;
                    if (currentUser) {
                        // Retry with current user if found
                        firebase.firestore().collection('users').doc(currentUser.uid).set({
                            tier: 'pro_unlimited',
                            email: currentUser.email,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true }).then(() => {
                            window.location.href = "preview.html";
                        });
                    } else {
                        document.querySelector('h2').textContent = "🔒 Sign In Required";
                        document.querySelector('p').innerHTML = 'Please <a href="services/login.html" style="color: #2ecc71;">sign in to your account</a> to claim your Pro pass.';
                    }
                }, 1500);
            }
        });
    </script>
</body>
</html>
