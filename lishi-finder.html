<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVA Lishi Pick Finder | Smart Tooling Reference</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0b0d;
            --card-bg: #131519;
            --border-color: rgba(255, 255, 255, 0.1);
            --sva-green: #2ecc71;
            --sva-green-dark: #27ae60;
            --text-main: #ffffff;
            --text-muted: #8e959f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px 60px;
        }

        .finder-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .app-header {
            text-align: center;
            border-bottom: 2px solid var(--sva-green);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .app-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Smart Search Box */
        .search-box {
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            background-color: #08090a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--sva-green);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.2);
        }

        /* Form Controls */
        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: #d1d5db;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 14px 12px;
            background-color: #08090a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--sva-green);
        }

        select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Single Result Display Card (Dropdown Mode) */
        .result-box {
            display: none;
            background: linear-gradient(135deg, #18281f 0%, #111b15 100%);
            border: 2px solid var(--sva-green);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            margin-top: 25px;
            animation: fadeIn 0.3s ease-out;
        }

        .result-header {
            font-size: 0.75rem;
            color: var(--sva-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .lishi-code {
            font-size: clamp(1.8rem, 6vw, 2.6rem);
            font-weight: 800;
            color: #ffffff;
            margin: 5px 0 10px;
            letter-spacing: 1px;
            word-break: break-word;
        }

        .tool-note {
            display: inline-block;
            background-color: rgba(46, 204, 113, 0.15);
            color: var(--sva-green);
            border: 1px solid rgba(46, 204, 113, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Smart Live Search List Cards */
        .live-results-container {
            display: none;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .live-card {
            background: #181b20;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--sva-green);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.2s ease-out;
        }

        .live-card-info h4 {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .live-card-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .live-card-tool {
            background: rgba(46, 204, 113, 0.15);
            color: var(--sva-green);
            border: 1px solid rgba(46, 204, 113, 0.4);
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 1.1rem;
            white-space: nowrap;
            text-align: right;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }

        /* Action Buttons */
        .btn-reset {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="finder-container">
        <div class="app-header">
            <h1>SVA Lishi Pick Finder</h1>
            <p>Automotive & Commercial Vehicle Guide</p>
        </div>

        <!-- Smart Search Box -->
        <div class="search-box">
            <input type="text" id="filterInput" class="search-input" placeholder="⚡ Try: 'BMW 5 Series 2016' or 'Transit Custom'...">
        </div>

        <!-- Live Search Results (Appears immediately when typing) -->
        <div id="liveResults" class="live-results-container" style="display: none;"></div>
        
        <!-- Classic Dropdown UI (Hidden while searching) -->
        <div id="dropdownSection">
            <div class="control-group">
                <label for="makeSelect">1. Select Manufacturer</label>
                <select id="makeSelect">
                    <option value="">-- Choose Make --</option>
                </select>
            </div>

            <div class="control-group">
                <label for="modelSelect">2. Select Model / Series</label>
                <select id="modelSelect" disabled>
                    <option value="">-- Choose Model --</option>
                </select>
            </div>

            <div class="control-group">
                <label for="yearSelect">3. Select Generation / Year</label>
                <select id="yearSelect" disabled>
                    <option value="">-- Choose Year --</option>
                </select>
            </div>

            <!-- Single Result Display Block -->
            <div id="resultBox" class="result-box">
                <div class="result-header">Required Lishi Pick Tool</div>
                <div id="lishiResult" class="lishi-code">--</div>
                <div id="toolNote" class="tool-note" style="display: none;">--</div>
            </div>
        </div>

        <button type="button" id="btnReset" class="btn-reset">Reset Lookup</button>
    </div>

    <script src="services/car-database.js"></script>

    <script>
        // LISHI FINDER LOGIC — vehicle database loaded from services/car-database.js

        const makeSelect = document.getElementById('makeSelect');
        const modelSelect = document.getElementById('modelSelect');
        const yearSelect = document.getElementById('yearSelect');
        const resultBox = document.getElementById('resultBox');
        const lishiResult = document.getElementById('lishiResult');
        const toolNote = document.getElementById('toolNote');
        const filterInput = document.getElementById('filterInput');
        const btnReset = document.getElementById('btnReset');
        const liveResults = document.getElementById('liveResults');
        const dropdownSection = document.getElementById('dropdownSection');

        // Populate Manufacturers in Dropdown
        function populateMakes() {
            makeSelect.innerHTML = '<option value="">-- Choose Make --</option>';
            Object.keys(carDatabase).sort().forEach(make => {
                makeSelect.add(new Option(make, make));
            });
        }
        populateMakes();

        // SMART YEAR RANGE MATCHER
        function smartYearMatch(rangeStr, queryYear) {
            const yearNum = parseInt(queryYear, 10);
            if (isNaN(yearNum)) return false;

            // Check "2010 - 2017"
            const rangeMatch = rangeStr.match(/(\d{4})\s*-\s*(\d{4})/);
            if (rangeMatch) {
                return yearNum >= parseInt(rangeMatch[1], 10) && yearNum <= parseInt(rangeMatch[2], 10);
            }

            // Check "2016+"
            const plusMatch = rangeStr.match(/(\d{4})\+/);
            if (plusMatch) {
                return yearNum >= parseInt(plusMatch[1], 10);
            }

            // Fallback direct string check
            return rangeStr.includes(queryYear);
        }

        // SMART LIVE SEARCH ENGINE
        filterInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();

            if (!query) {
                liveResults.style.display = 'none';
                dropdownSection.style.display = 'block';
                return;
            }

            dropdownSection.style.display = 'none';
            liveResults.style.display = 'flex';
            liveResults.innerHTML = '';

            const tokens = query.split(/\s+/);
            let matches = [];

            Object.entries(carDatabase).forEach(([make, models]) => {
                Object.entries(models).forEach(([model, years]) => {
                    Object.entries(years).forEach(([yearRange, lishi]) => {
                        const fullString = `${make} ${model} ${yearRange}`.toLowerCase();
                        
                        // Check if all search tokens match either the text OR the year range math
                        const allTokensMatch = tokens.every(token => {
                            if (/^\d{4}$/.test(token)) {
                                return smartYearMatch(yearRange, token) || fullString.includes(token);
                            }
                            return fullString.includes(token);
                        });

                        if (allTokensMatch) {
                            matches.push({ make, model, yearRange, lishi });
                        }
                    });
                });
            });

            if (matches.length === 0) {
                liveResults.innerHTML = `<div class="no-results">No vehicles matching "<b>${this.value}</b>". Try searching by make or model.</div>`;
                return;
            }

            // Limit display to top 15 results for speed
            matches.slice(0, 15).forEach(item => {
                const card = document.createElement('div');
                card.className = 'live-card';
                card.innerHTML = `
                    <div class="live-card-info">
                        <h4>${item.make} — ${item.model}</h4>
                        <p>Years: ${item.yearRange}</p>
                    </div>
                    <div class="live-card-tool">${item.lishi}</div>
                `;
                liveResults.appendChild(card);
            });
        });

        // Handle Make Selection
        makeSelect.addEventListener('change', function() {
            modelSelect.innerHTML = '<option value="">-- Choose Model --</option>';
            yearSelect.innerHTML = '<option value="">-- Choose Year --</option>';
            yearSelect.disabled = true;
            resultBox.style.display = 'none';

            if (this.value) {
                modelSelect.disabled = false;
                Object.keys(carDatabase[this.value]).forEach(model => {
                    modelSelect.add(new Option(model, model));
                });
            } else {
                modelSelect.disabled = true;
            }
        });

        // Handle Model Selection
        modelSelect.addEventListener('change', function() {
            yearSelect.innerHTML = '<option value="">-- Choose Year --</option>';
            resultBox.style.display = 'none';

            if (this.value) {
                yearSelect.disabled = false;
                const make = makeSelect.value;
                Object.keys(carDatabase[make][this.value]).forEach(year => {
                    yearSelect.add(new Option(year, year));
                });
            } else {
                yearSelect.disabled = true;
            }
        });

        // Handle Year Selection & Display Results
        yearSelect.addEventListener('change', function() {
            if (this.value) {
                const make = makeSelect.value;
                const model = modelSelect.value;
                const rawResult = carDatabase[make][model][this.value];

                const noteMatch = rawResult.match(/\((.*?)\)/);
                let mainCode = rawResult;
                
                if (noteMatch) {
                    mainCode = rawResult.replace(/\s*\(.*?\)/, '');
                    toolNote.textContent = 'NOTE: ' + noteMatch[1];
                    toolNote.style.display = 'inline-block';
                } else {
                    toolNote.style.display = 'none';
                }
                
                lishiResult.textContent = mainCode;
                resultBox.style.display = 'block';
            } else {
                resultBox.style.display = 'none';
            }
        });

        // Reset Button
        btnReset.addEventListener('click', function() {
            filterInput.value = '';
            liveResults.style.display = 'none';
            dropdownSection.style.display = 'block';
            populateMakes();
            modelSelect.innerHTML = '<option value="">-- Choose Model --</option>';
            modelSelect.disabled = true;
            yearSelect.innerHTML = '<option value="">-- Choose Year --</option>';
            yearSelect.disabled = true;
            resultBox.style.display = 'none';
        });
    </script>
