        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .finder-container {
            background-color: #1a1a1a;
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .finder-container h2 {
            text-align: center;
            margin-top: 0;
            color: #fff;
            letter-spacing: 1px;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #0a0a0a;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #2ecc71;
        }
        /* The Result Box - High Contrast */
        .result-box {
            display: none; /* Hidden until a selection is made */
            background-color: #2ecc71;
            color: #000;
            text-align: center;
            padding: 20px;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
            animation: fadeIn 0.5s ease-in;
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        .result-box .lishi-code {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }

        const makeSelect = document.getElementById('makeSelect');
        const modelSelect = document.getElementById('modelSelect');
        const yearSelect = document.getElementById('yearSelect');
        const resultBox = document.getElementById('resultBox');
        const lishiResult = document.getElementById('lishiResult');

        // 1. Populate the "Make" dropdown based on our database
        for (let make in carDatabase) {
            makeSelect.add(new Option(make, make));
        }

        // 2. When a Make is chosen, populate the "Model" dropdown
        makeSelect.addEventListener('change', function() {
            modelSelect.innerHTML = '<option value="">-- Choose Model --</option>';
            yearSelect.innerHTML = '<option value="">-- Choose Year --</option>';
            resultBox.style.display = 'none';
            yearSelect.disabled = true;

            if (this.value) {
                modelSelect.disabled = false;
                for (let model in carDatabase[this.value]) {
                    modelSelect.add(new Option(model, model));
                }
            } else {
                modelSelect.disabled = true;
            }
        });

        // 3. When a Model is chosen, populate the "Year" dropdown
        modelSelect.addEventListener('change', function() {
            yearSelect.innerHTML = '<option value="">-- Choose Year --</option>';
            resultBox.style.display = 'none';

            if (this.value) {
                yearSelect.disabled = false;
                const make = makeSelect.value;
                for (let year in carDatabase[make][this.value]) {
                    yearSelect.add(new Option(year, year));
                }
            } else {
                yearSelect.disabled = true;
            }
        });

        // 4. When the Year is chosen, reveal the bright green result box!
        yearSelect.addEventListener('change', function() {
            if (this.value) {
                const make = makeSelect.value;
                const model = modelSelect.value;
                const lishi = carDatabase[make][model][this.value];
                
                lishiResult.textContent = lishi;
                resultBox.style.display = 'block';
            } else {
                resultBox.style.display = 'none';
            }
        });
